[package]
name = "agent-api"
version = "0.1.0"
edition = "2024"
license.workspace = true
# One integration-test binary (tests/all.rs): 105 targets each linked the shared helpers and the whole crate
# (~150-200 MB apiece), which made CI's test step 34 of its 46 minutes and filled the runner volume.
autotests = false
description = "HTTP backend for agent.nonagentic.ai: identity, tenancy and early-access signup"

[dependencies]
agent-model = { path = "../agent-model" }
anyhow = "=1.0.104"
# B4 T1: SSE bodies built from async generators (the runtime's event feeds).
async-stream = "=0.3.6"
axum = { version = "=0.8.9", features = ["multipart"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
# B3 T7: column preview of CSV / XLSX sources (crate::tabular).
csv = "=1.4.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
hex = "=0.4.3"
# SW-9 attachments (crate::attachments::validate): decode with limits, strip metadata by re-encoding. Pure Rust, no rayon.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = "=9.3.1"
# SW-9: PDF structure check (every object walked for active-content keys), under a size/time budget.
lopdf = { version = "=0.46.0", default-features = false }
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
quick-xml = "=0.42.0"
# B4 T1: the runtime bus (crate::runtime): Redis Streams, Pub/Sub nudges, Lua scripts, a reconnecting manager.
redis = { version = "=1.7.1", features = ["tokio-comp", "streams", "script", "aio", "connection-manager"] }
reqwest = { version = "=0.13.5", features = ["json", "multipart"] }
ring = "=0.17.14"
# MCP client (crate::mcp_client): streamable HTTP to nonagenticai_mcp_server, tasks extension.
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.28.0", features = ["v4", "v7", "serde"] }
# The unwrapped tenant DEK (connectors::custody) is wiped through `Zeroize` rather than a hand-rolled
# `ptr::write_volatile` loop: the trait is the audited form of that wipe (volatile writes, no elision).
zeroize = "=1.9.1"
# XLSX column preview (crate::tabular). Read-only deflate via zlib-rs; zip <9.0.3 is yanked (security advisories).
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
http-body-util = "=0.1.5"
libc = "=0.2.190"
rsa = { version = "=0.9.10", features = ["std"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres", "redis"] }
tower = { version = "=0.5.3", features = ["util"] }

[[test]]
name = "all"
path = "tests/all.rs"

# Each needs a process of its own: a never-touched metrics recorder, the one global log subscriber, and the
# cluster-global agent_platform role it revokes and renames (on its own Postgres container).
[[test]]
name = "metrics_boot"
path = "tests/metrics_boot.rs"

[[test]]
name = "observability"
path = "tests/observability.rs"

[[test]]
name = "platform_role"
path = "tests/platform_role.rs"
