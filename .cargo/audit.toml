# cargo-audit config (read by the rust-library archetype's `cargo audit` step).
[advisories]
ignore = [
  # RUSTSEC-2023-0071: rsa — Marvin timing side-channel on PKCS#1 v1.5 decryption; no fixed
  # release exists. `rsa` is ONLY a dev-dependency of agent-api, used to generate
  # throwaway JWT signing keys in tests; it never ships in an image and never decrypts
  # attacker-supplied data. Revisit if it gains a normal edge.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0459: libsqlite3-sys (CVE-2026-119375) — SQLite can return uninitialised page-cache memory when a
  # process opens a crafted database file together with a sibling -wal file. The crate is reachable ONLY as an
  # optional dependency of sqlx-sqlite; `sqlx =0.9.0` here sets `default-features = false` and enables only
  # postgres, so SQLite is never compiled, never linked and never opens a database in this workspace. No fixed
  # release is reachable: sqlx 0.9.0 (the newest) pins libsqlite3-sys >=0.30.1, <0.38.0, while the patch is in
  # 0.39.x. Revisit when a newer sqlx raises that bound (tracked like the rsa entry above).
  "RUSTSEC-2026-0459",
]
