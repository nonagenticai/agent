# One Rust toolchain for this repo, everywhere: the same release CI installs
# (`.github/workflows/ci-public.yml`, the "toolchain follows rust-toolchain.toml"
# step) and the image builds with (`Dockerfile.rust`). The estate builders' rustup
# default is older, so without this file a bare `cargo` compiles with the default
# instead of the release the service ships on.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
